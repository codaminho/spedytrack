<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e85d04">
<title>Gonzalez Concrete — Attendance DB</title>
<style>
  :root {
    --primary: #e85d04;
    --bg: #000000;
    --card-bg: #1a1a1a;
    --text: #ffffff;
    --text-dim: #a0a0a0;
    --green-bright: #39ff14;
    --red-bright: #ff3131;
  }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px;
    background: #111;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .main-content { flex: 1; overflow-y: auto; padding: 15px; }
  .employee-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #222;
  }
  .admin-panel {
    background: #111;
    border-top: 1px solid #333;
    padding: 20px;
    display: none;
  }
  input {
    width: 100%;
    background: #222;
    border: 1px solid #444;
    color: white;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--primary);
    padding: 10px 20px;
    border-radius: 20px;
    display: none;
    z-index: 100;
  }
</style>
</head>
<body>

<header>
  <div style="font-weight:900">GONZALEZ <span style="color:var(--primary)">CONCRETE</span></div>
  <button onclick="askAdmin()" style="font-size:12px; background:#333">ADMIN</button>
</header>

<div class="main-content" id="crewList">
  </div>

<div class="admin-panel" id="adminPanel">
  <input type="text" id="en" placeholder="Nom Complet">
  <input type="text" id="ero" placeholder="Rôle">
  <input type="text" id="ei" placeholder="ID Badge">
  <input type="number" id="ep" placeholder="PIN (4 chiffres)">
  <button onclick="addEmp()" style="width:100%">AJOUTER À LA DB</button>
  <button onclick="closeAdmin()" style="width:100%; margin-top:10px; background:#333">RETOUR</button>
</div>

<div id="toast"></div>

<script>
let db;
const dbName = "GCTrackDB";

// 1. INITIALISATION DE LA BASE DE DONNÉES
const request = indexedDB.open(dbName, 1);

request.onupgradeneeded = (e) => {
  db = e.target.result;
  if (!db.objectStoreNames.contains("crew")) {
    const store = db.createObjectStore("crew", { keyPath: "id" });
    // Données par défaut
    store.add({ id: 'ADMIN', name: 'Admin 1', role: 'ADMIN', pin: '0000', admin: true });
    store.add({ id: 'JORGES', name: 'Admin 2', role: 'JORGES', pin: '2026', admin: true });
    store.add({ id: 'G01', name: 'Ramiro Gonzalez', role: 'Foreman', pin: '1234', admin: false });
  }
};

request.onsuccess = (e) => {
  db = e.target.result;
  rEL();
};

// 2. AFFICHAGE DE L'INTERFACE (AVEC FILTRE ADMIN)
function rEL() {
  const transaction = db.transaction(["crew"], "readonly");
  const store = transaction.objectStore("crew");
  const getRequest = store.getAll();

  getRequest.onsuccess = () => {
    const emps = getRequest.result;
    const list = document.getElementById('crewList');
    
    list.innerHTML = emps
      .filter(e => e.id !== 'ADMIN' && e.id !== 'JORGES') // CACHE LES ADMINS DE L'INTERFACE
      .map(e => `
        <div class="employee-card">
          <div>
            <div style="font-weight:bold">${e.name}</div>
            <div style="color:var(--text-dim); font-size:12px">${e.role} • ${e.id}</div>
          </div>
          ${!e.admin ? `<button onclick="rmEmp('${e.id}')" style="background:none; color:var(--red-bright)">✕</button>` : ''}
        </div>
      `).join('');
  };
}

// 3. ACTIONS ADMIN
function askAdmin() {
  const p = prompt("PIN Administrateur :");
  const transaction = db.transaction(["crew"], "readonly");
  const store = transaction.objectStore("crew");
  const req = store.getAll();

  req.onsuccess = () => {
    const admin = req.result.find(e => e.admin && e.pin === p);
    if(admin) {
      document.getElementById('adminPanel').style.display = 'block';
      toast("Accès autorisé : " + admin.name);
    } else {
      toast("PIN incorrect", true);
    }
  };
}

function addEmp() {
  const n = document.getElementById('en').value.trim();
  const r = document.getElementById('ero').value.trim();
  const i = document.getElementById('ei').value.trim().toUpperCase();
  const p = document.getElementById('ep').value.trim();

  if(!n || !i || !p) return toast("Champs manquants", true);

  const transaction = db.transaction(["crew"], "readwrite");
  const store = transaction.objectStore("crew");
  
  const addReq = store.add({ id: i, name: n, role: r, pin: p, admin: false });
  
  addReq.onsuccess = () => {
    rEL();
    toast("Employé ajouté à la base de données");
    ['en','ero','ei','ep'].forEach(id => document.getElementById(id).value = '');
  };
  addReq.onerror = () => toast("ID déjà existant", true);
}

function rmEmp(id) {
  if(confirm("Supprimer définitivement de la base de données ?")) {
    const transaction = db.transaction(["crew"], "readwrite");
    transaction.objectStore("crew").delete(id);
    transaction.oncomplete = () => rEL();
  }
}

function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }

function toast(m, err=false) {
  const t = document.getElementById('toast');
  t.innerText = m;
  t.style.background = err ? 'var(--red-bright)' : 'var(--primary)';
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}
</script>
</body>
</html>
